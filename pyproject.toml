[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maptool"
version = "0.1.0"
description = "Bohemia / Songs-of-Syx-style climate-painted terrain maps from public DEM + landcover sources."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Till" }]
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "rasterio>=1.3",
    "requests>=2.31",
    "scipy>=1.11",
    "python-dotenv>=1.0",
    "fal-client>=0.5",
    "gradio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
]

[project.scripts]
maptool = "maptool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires network or large data",
]
